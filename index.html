<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FixMate - Need a Fix? Find Your Mate.</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="FixMate connects people in Sri Lanka with local service professionals. Clickable prototype with demo data.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
:root{--blue:#1554F0;--btn:#1554F0;--navy:#0B2E7A;--blue-50:#EDF2FF;--green:#0E9F5B;--green-50:#E4F6EC;--amber:#A96A08;--amber-50:#FFF3DA;--red:#D93025;--red-50:#FDECEA;--ink:#0E1A33;--muted:#57667F;--line:#E1E7F2;--bg:#F5F7FB;--card:#fff;--mapbg:#E6EDF8;--road:#fff;--star:#F5A623;--shadow:0 1px 2px rgba(14,26,51,.05),0 8px 24px rgba(14,26,51,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--blue:#6C93FF;--blue-50:#15234A;--green:#2BC17A;--green-50:#0F2F25;--amber:#F0B44C;--amber-50:#3A2C0E;--red:#FF6B5E;--red-50:#3A1717;--ink:#E9EEFB;--muted:#9AA9C6;--line:#23304D;--bg:#0A1120;--card:#111B31;--mapbg:#16223C;--road:#22315A;--shadow:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--blue:#6C93FF;--blue-50:#15234A;--green:#2BC17A;--green-50:#0F2F25;--amber:#F0B44C;--amber-50:#3A2C0E;--red:#FF6B5E;--red-50:#3A1717;--ink:#E9EEFB;--muted:#9AA9C6;--line:#23304D;--bg:#0A1120;--card:#111B31;--mapbg:#16223C;--road:#22315A;--shadow:0 1px 2px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{font-family:'Plus Jakarta Sans','Noto Sans Sinhala','Noto Sans Tamil',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{line-height:1.2;letter-spacing:-.01em}
h1{font-size:clamp(30px,5vw,52px);font-weight:800;letter-spacing:-.025em}
h2{font-size:22px;font-weight:800}h3{font-size:17px;font-weight:700}h4{font-size:15px;font-weight:700}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}.ic.fill{fill:currentColor;stroke:none}
.sub{color:var(--muted);font-size:13px}.grow{flex:1;min-width:0}.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.between{justify-content:space-between}
.mt{margin-top:16px}.mt2{margin-top:8px}.mb{margin-bottom:16px}.center{text-align:center}
/* demo bar */
.demobar{background:#081B44;color:#DCE6FF;font-size:12px;position:relative;z-index:60}
.db-in{max-width:1120px;margin:0 auto;padding:6px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.db-tag{font-weight:600;margin-right:auto;opacity:.85}
.seg{display:flex;background:rgba(255,255,255,.1);border-radius:99px;padding:2px}
.seg button{color:#DCE6FF;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:600;min-height:28px}
.seg button.on{background:#fff;color:#0B2E7A}
.demobar select{background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:8px;padding:4px 6px;font-size:12px;min-height:28px}
.demobar select option{color:#000}
.dbtn{background:var(--green);color:#fff;border-radius:99px;padding:4px 12px;font-weight:700;font-size:12px;min-height:28px}
/* header */
.hdr{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:50}
.hdr-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px;letter-spacing:-.02em}.brand b{color:var(--blue)}
.dnav{display:none;gap:4px;margin-left:8px}
.dnav button{padding:8px 12px;border-radius:10px;font-weight:600;color:var(--muted);min-height:40px}
.dnav button:hover{background:var(--blue-50);color:var(--blue)}.dnav button.on{color:var(--blue);background:var(--blue-50)}
.iconbtn{position:relative;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--blue-50)}
.dot{position:absolute;top:6px;right:6px;background:var(--red);color:#fff;border-radius:99px;font-size:10px;min-width:16px;height:16px;display:grid;place-items:center;font-weight:700}
.bnav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:55}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 2px;min-height:52px;border-radius:12px}
.bnav button.on{color:var(--blue)}
@media(min-width:900px){.dnav{display:flex}.bnav{display:none}.view{padding-bottom:60px!important}}
.view{max-width:1120px;margin:0 auto;padding:18px 16px 100px}
.fade{animation:fade .28s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* base components */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px}
.card.flat{box-shadow:none}
.hov{transition:transform .18s,border-color .18s}.hov:hover{transform:translateY(-2px);border-color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--btn);color:#fff;font-weight:700;border-radius:12px;padding:11px 18px;min-height:46px;transition:transform .12s,filter .15s;text-align:center}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
.btn.soft{background:var(--blue-50);color:var(--blue)}
.btn.green{background:var(--green);color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.plain{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:40px;padding:8px 14px;font-size:14px;border-radius:10px}
.btn.block{width:100%}.btn[disabled]{opacity:.5;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;color:var(--ink);min-height:36px}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.scrollx{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}.scrollx>*{flex:none}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700}
.badge.blue{background:var(--blue-50);color:var(--blue)}.badge.green{background:var(--green-50);color:var(--green)}.badge.amber{background:var(--amber-50);color:var(--amber)}.badge.red{background:var(--red-50);color:var(--red)}.badge.gray{background:var(--line);color:var(--muted)}
.vb{display:inline-flex;align-items:center;gap:3px;background:var(--green-50);color:var(--green);border-radius:99px;padding:2px 8px;font-size:11.5px;font-weight:700;margin-left:6px;white-space:nowrap}
.rt{display:inline-flex;align-items:center;gap:3px;font-weight:700}.rt .ic{color:var(--star)}
.av{border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;flex:none}
.lnk{color:var(--ink);font-weight:700;text-align:left}.lnk:hover{color:var(--blue)}
label.f{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}
.in,.sel,.ta{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;min-height:46px}
.ta{min-height:96px;resize:vertical}.in:focus,.sel:focus,.ta:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-50)}
.err{color:var(--red);font-size:13px;font-weight:600;margin-top:6px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(2,1fr)}@media(min-width:700px){.g4{grid-template-columns:repeat(4,1fr)}}
.sec{margin-top:26px}.sec>.row{margin-bottom:12px}
.link{color:var(--blue);font-weight:700;font-size:14px}
/* provider card */
.pcard .prow{display:flex;gap:12px;align-items:flex-start}.pn{font-weight:700;font-size:16px;display:flex;align-items:center;flex-wrap:wrap}
.pcard .chips{margin:12px 0}.pfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:12px;flex-wrap:wrap}
.price{font-weight:800;font-size:16px}.pbtns{display:flex;gap:8px}
.heart{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}.heart:hover{background:var(--red-50)}
.heart.on{color:var(--red)}.heart.on .ic{fill:currentColor}.heart.pop .ic{animation:pop .4s}@keyframes pop{40%{transform:scale(1.4)}}
.mini{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--muted)}
.mini.g{color:var(--green);font-weight:700}.mini.a{color:var(--amber);font-weight:700}
/* categories */
.cat{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;text-align:center;font-weight:600;font-size:13.5px;border-radius:16px;background:var(--card);border:1px solid var(--line);min-height:104px;transition:transform .18s,border-color .18s}
.cat:hover{transform:translateY(-2px);border-color:var(--blue)}
.tile{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px}
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media(min-width:700px){.catgrid{grid-template-columns:repeat(6,1fr)}}
/* hero / landing */
.lhead{max-width:1120px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:14px}
.lhead .lnav{display:none;gap:4px;margin-left:12px}@media(min-width:900px){.lhead .lnav{display:flex}}
.lnav button{padding:8px 12px;font-weight:600;color:var(--muted);border-radius:10px}.lnav button:hover{color:var(--blue)}
.hero{background:var(--navy);color:#fff;border-radius:0 0 32px 32px}
.hero-in{max-width:1120px;margin:0 auto;padding:36px 16px 56px;display:grid;gap:36px;align-items:center}
@media(min-width:900px){.hero-in{grid-template-columns:1.15fr .85fr;padding:56px 16px 72px}}
.hero .brand b{color:#8FB0FF}.hero p.lead{font-size:18px;color:#C9D8FF;margin:16px 0 22px;max-width:560px}
.locbox{display:flex;align-items:center;gap:10px;background:#fff;color:#0E1A33;border-radius:16px;padding:6px 6px 6px 14px;max-width:520px;box-shadow:0 12px 30px rgba(0,0,0,.25);flex-wrap:wrap}
.locbox button.pick{flex:1;display:flex;align-items:center;gap:8px;text-align:left;min-height:46px;font-weight:600;min-width:200px}
.locbox small{display:block;font-size:11.5px;color:#57667F;font-weight:500}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn.wht{background:#fff;color:var(--navy)}.btn.outw{background:transparent;border:1.5px solid rgba(255,255,255,.6);color:#fff}
.heroviz{position:relative;max-width:400px;margin:0 auto;width:100%}
.heroviz .card{color:var(--ink)}
.float{position:absolute;background:var(--card);color:var(--ink);border-radius:14px;padding:8px 12px;font-weight:700;font-size:13px;box-shadow:0 10px 26px rgba(0,0,0,.28);display:flex;gap:6px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:22px;max-width:520px}.stats b{display:block;font-size:22px}.stats span{font-size:12.5px;color:#B9CBFA}
.lsec{max-width:1120px;margin:0 auto;padding:44px 16px 0}
.steps{display:grid;gap:14px}@media(min-width:800px){.steps{grid-template-columns:repeat(3,1fr)}}
.stepn{width:34px;height:34px;border-radius:50%;background:var(--blue-50);color:var(--blue);display:grid;place-items:center;font-weight:800;margin-bottom:10px}
.band{background:var(--blue-50);border-radius:24px;padding:26px;display:grid;gap:18px;align-items:center}@media(min-width:800px){.band{grid-template-columns:1.2fr .8fr}}
.foot{max-width:1120px;margin:40px auto 30px;padding:20px 16px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
/* forms and steps */
.prog{display:flex;gap:6px;margin:8px 0 18px}.prog i{flex:1;height:6px;border-radius:9px;background:var(--line)}.prog i.on{background:var(--blue)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);min-height:52px;font-weight:600;margin-bottom:8px}
.opt.on{border-color:var(--blue);background:var(--blue-50)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}.opt.on .radio{border-color:var(--blue)}.opt.on .radio:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--blue)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}.kv:last-child{border:0}.kv span:first-child{color:var(--muted)}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:18px;padding-top:12px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.th{width:64px;height:64px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#5b7ea6,#2e4b6e)}
.th:nth-child(2n){background:linear-gradient(135deg,#7a8f6a,#3f5533)}.th:nth-child(3n){background:linear-gradient(135deg,#a58a6b,#5c4630)}
.note{display:flex;gap:10px;background:var(--blue-50);border-radius:12px;padding:11px 13px;font-size:13.5px;align-items:flex-start}.note .ic{margin-top:2px;color:var(--blue)}
.note.warn{background:var(--amber-50)}.note.warn .ic{color:var(--amber)}.note.bad{background:var(--red-50)}.note.bad .ic{color:var(--red)}
/* timeline */
.tl{list-style:none;padding:0;margin:6px 0 0}.tl li{display:flex;gap:14px;position:relative;padding-bottom:20px}
.tl li:last-child{padding-bottom:0}
.tl li:before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}.tl li:last-child:before{display:none}.tl li.done:before{background:var(--green)}
.tl .d{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--card);flex:none;color:#fff}
.tl li.done .d{background:var(--green);border-color:var(--green)}
.tl li.cur .d{border-color:var(--blue)}.tl li.cur .d:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--blue);animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.5);opacity:.5}}
.tl .t{font-weight:700}.tl li:not(.done):not(.cur) .t{color:var(--muted);font-weight:600}
/* map */
.map{border-radius:16px;overflow:hidden;border:1px solid var(--line);position:relative;background:var(--mapbg)}.map svg{display:block;width:100%;height:auto}
.eta{position:absolute;left:12px;bottom:12px;background:var(--card);border-radius:12px;padding:8px 12px;font-weight:700;box-shadow:var(--shadow)}
/* stats */
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.stat b{font-size:24px;display:block;letter-spacing:-.02em}.stat span{font-size:13px;color:var(--muted)}
/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;min-height:44px}.tabs button.on{color:var(--blue);border-color:var(--blue)}
/* chat */
.chatwrap{display:flex;flex-direction:column;height:calc(100vh - 230px);min-height:420px;max-width:720px;margin:0 auto}
.chatbody{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px 16px 0 0}
.bub{max-width:78%;padding:9px 13px;border-radius:16px;font-size:14.5px}.bub small{display:block;font-size:11px;opacity:.7;margin-top:2px}
.bub.me{align-self:flex-end;background:var(--btn);color:#fff;border-bottom-right-radius:4px}.bub.them{align-self:flex-start;background:var(--blue-50);border-bottom-left-radius:4px}
.chatin{display:flex;gap:8px;padding:10px;background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 16px 16px;align-items:center}
.chatin .in{min-height:44px}
.quick{display:flex;gap:8px;overflow-x:auto;padding:8px 0}.quick button{flex:none}
/* rating */
.stars{display:flex;gap:2px}.stars button{width:44px;height:44px;color:var(--line);transition:transform .12s}.stars button.on{color:var(--star)}.stars button:hover{transform:scale(1.15)}.stars .ic{width:28px;height:28px;fill:currentColor;stroke:none}
.stars.s button{width:32px;height:32px}.stars.s .ic{width:20px;height:20px}
/* toggles */
.tg{width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.2s}.tg:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:.2s}.tg.on{background:var(--green)}.tg.on:after{left:23px}
/* skeleton / empty */
.sk{background:linear-gradient(90deg,var(--line) 25%,var(--blue-50) 50%,var(--line) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:10px}@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}.empty .big{font-size:40px}.empty h3{color:var(--ink);margin:8px 0 4px}
/* modal / toast */
.ov{position:fixed;inset:0;background:rgba(6,14,34,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@media(min-width:700px){.ov{align-items:center}}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));position:relative;animation:up .25s}
@media(min-width:700px){.sheet{border-radius:22px}}@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet .x{position:absolute;right:10px;top:10px;width:44px;height:44px;display:grid;place-items:center;border-radius:12px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#0E1A33;color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.bad{background:var(--red)}
@media(min-width:900px){#toast{bottom:30px}}
.offline{background:var(--amber-50);color:var(--amber);text-align:center;font-weight:700;padding:8px;font-size:13.5px}
/* success */
.okc{width:84px;height:84px;border-radius:50%;background:var(--green);display:grid;place-items:center;color:#fff;margin:0 auto 12px;animation:pop .6s}.okc .ic{stroke-width:3}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:600;font-size:12.5px}tr:last-child td{border:0}
.bars{display:flex;gap:8px;align-items:flex-end;height:110px}.bars div{flex:1;background:var(--blue);border-radius:6px 6px 0 0;opacity:.85;position:relative}.bars span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted)}
details.acc{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);margin-bottom:8px}details.acc summary{font-weight:700;cursor:pointer;min-height:24px}details.acc p,details.acc ul{margin-top:8px;color:var(--muted);font-size:14px;padding-left:0}details.acc ul{padding-left:18px}

.otp{display:flex;gap:8px;justify-content:center;margin:16px 0}.otp span{width:42px;height:52px;border:1.5px solid var(--line);border-radius:12px;display:grid;place-items:center;font-size:22px;font-weight:800}
.sos{background:var(--red-50);border:1.5px solid var(--red);border-radius:16px;padding:14px}

<div class="grid g2 mt"><div class="card menu"><h4 class="mb">Account</h4>
<button ${R('bookings',{tab:'Completed'})}>${ic('list',20)}<span class="grow">Previous bookings</span>${ic('chev',16)}</button>
<button ${R('saved')}>${ic('heart',20)}<span class="grow">Favorite providers</span>${ic('chev',16)}</button>
<button ${G('notifs')}>${ic('bell',20)}<span class="grow">Notifications</span>${ic('chev',16)}</button>
<button ${G('trust')}>${ic('help',20)}<span class="grow">Help and support</span>${ic('chev',16)}</button>
<button ${G('emergency')}>${ic('alert',20)}<span class="grow">Emergency help</span>${ic('chev',16)}</button>
<button data-a="role" data-v="provider">${ic('tool',20)}<span class="grow">Switch to FixMate provider view</span>${ic('chev',16)}</button>
<button data-a="signout">${ic('logout',20)}<span class="grow">Sign out</span></button></div>
<div><details class="acc" open><summary>Saved addresses</summary><div class="kv mt2"><span>Home</span><span>25 Main Street, Akkaraipattu</span></div><div class="kv"><span>Shop</span><span>Bazaar Road, Kalmunai</span></div></details>
<details class="acc"><summary>Payment methods</summary><p>Cash on completion (default), card, bank transfer and digital wallet are available in the simulated checkout. No real card details are stored in this prototype.</p></details>
<details class="acc"><summary>Settings</summary><div class="row between mt2"><span>Language</span><div class="chips">${[['en','English'],['si','සිංහල'],['ta','தமிழ்']].map(x=>`<button class="chip ${S.lang===x[0]?'on':''}" data-a="lang" data-v="${x[0]}">${x[1]}</button>`).join('')}</div></div><p class="sub mt2">Sinhala and Tamil cover the main navigation and landing text only. Draft translations need review by native speakers.</p></details></div></div>`;
V.notifs=()=>{const l=S.notifs[S.role];return`${pageHead('Notifications','',false)}<div class="row mb"><button class="btn sm soft" data-a="readAll">Mark all as read</button></div>${l.length?`<div class="card">${l.map(n=>`<div class="row" style="padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start"><span style="color:${n.u?'var(--blue)':'var(--muted)'}">${ic('bell',20)}</span><div class="grow"><div style="font-weight:${n.u?700:500}">${esc(n.t)}</div><div class="sub">${esc(n.ts)}</div></div>${n.u?'<span class="badge blue">New</span>':''}</div>`).join('')}</div>`:empty('🔔','You are all caught up','New notifications will show up here.')}`};
/* ---- trust, emergency ---- */
V.trust=()=>{const rs=['Provider did not arrive','Unsafe behavior','Price dispute','Poor service','Fraud or scam concern','Other'];
return`${pageHead('Trust and safety','How FixMate helps you book with confidence')}<div class="grid g3">${[['shield','Provider verification','Providers submit NIC, certificates and proof of address. Prototype badges are demo data.'],['star','Ratings and reviews','Compare past customer feedback. Ratings help but do not guarantee quality.'],['file','Booking records','Every request, message and payment is recorded against a booking ID.'],['alert','Report a user or provider','Tell us about unsafe or unfair behaviour and our team reviews it.'],['phone','Emergency and help button','Fast route to emergency guidance. FixMate does not replace official emergency services.'],['dollar','Cancellation and refund policy','Clear rules so both sides know what to expect.']].map(a=>`<div class="card"><span class="tile" style="background:var(--blue-50);color:var(--blue)">${ic(a[0],24)}</span><h4 class="mt2">${a[1]}</h4><p class="sub mt2">${a[2]}</p></div>`).join('')}</div>
<div class="grid g2 mt"><div class="card"><h3>Report a problem</h3>${rs.map(r=>`<button class="opt mt2 ${S.rep.reason===r?'on':''}" data-a="repPick" data-v="${r}"><span class="radio"></span>${r}</button>`).join('')}<label class="f" for="rt">Details (optional)</label><textarea id="rt" class="ta" data-b="rep.text" placeholder="Tell us what happened...">${esc(S.rep.text)}</textarea>${S.err?`<div class="err">${esc(S.err)}</div>`:''}<button class="btn block mt" data-a="repSend">Send report</button></div>
<div><details class="acc" open><summary>Cancellation policy (draft)</summary><p>Cancel free of charge before the FixMate is on the way. After that, a travel fee may apply. Providers who cancel repeatedly lose visibility.</p></details>
<details class="acc"><summary>Refund policy (draft)</summary><p>If a paid job is not completed or a dispute is upheld, the amount is refunded to the original payment method within a few working days.</p></details>
<details class="acc"><summary>Dispute support</summary><p>Open any booking and choose Report booking. Disputes move through Submitted, Under review and Resolved.</p></details>
<details class="acc"><summary>Security design notes (concept)</summary><ul><li>Phone sign-in with OTP verification</li><li>Passwords hashed, sessions expire and can be revoked</li><li>Role-based access: customer, provider and admin are separate</li><li>Input validation and file-upload checks for photos and documents</li><li>Payments handled by a certified gateway, never stored by FixMate</li><li>Personal data minimised, phone numbers masked until a booking is confirmed</li><li>Encrypted connections and audit logs for admin actions</li></ul></details>
<div class="sos mt"><b>In immediate danger?</b><div class="sub">Call 119 (Police), 110 (Fire and Rescue) or 1990 (ambulance).</div><button class="btn red sm mt2" ${G('emergency')}>Emergency help</button></div></div></div>`};
V.emergency=()=>`${pageHead('Emergency help','For urgent home problems, not for danger to life')}<div class="sos mb"><div class="row" style="align-items:flex-start">${ic('alert',26)}<div><b>If anyone is in immediate danger, call official emergency services first.</b><div class="mt2">Police 119 · Fire and Rescue 110 · Ambulance 1990</div><div class="sub mt2">FixMate connects you with local professionals. It does not replace police, fire or ambulance services.</div></div></div></div>
<div class="grid g2">${[['🚰','Water leak','plumbing','Burst pipe or heavy leak'],['⚡','Electrical emergency','electrical','Sparks, power loss or tripping'],['🔑','Locked out','handyman','Door or lock problem'],['🔥','Emergency repair','handyman','Urgent damage that cannot wait']].map(a=>`<button class="card hov row" style="gap:14px;text-align:left" data-a="emerg" data-id="${a[2]}" data-v="${a[1]}"><span class="tile" style="background:var(--red-50)">${a[0]}</span><div class="grow"><b>${a[1]}</b><div class="sub">${a[3]}</div></div><span class="badge red">Priority</span></button>`).join('')}</div><p class="sub mt">Emergency requests list FixMates who are available now first and add a priority fee (demo: LKR 500).</p>`;
/* ---- quotes ---- */
const QDATA={p9:{labour:45000,mat:25000,tr:5000},p10:{labour:50000,mat:27000,tr:5000},p11:{labour:42000,mat:22000,tr:4000}};
V.quotes=()=>{if(S.qLoading)return`${pageHead('Requesting quotes...','Sent to 3 FixMates')}<div class="grid g3">${skel(3)}</div>`;
const l=S.qs.filter(x=>x.st!=='declined');const tot=x=>x.labour+x.mat+x.tr;
return`${pageHead('House painting quotes',`Received ${l.length} quote${l.length===1?'':'s'}. Compare and choose. FixMate never selects for you.`)}
${l.length?`<div class="grid g3">${l.map((x,i)=>{const p=prov(x.pid);return`<div class="card"><div class="row">${av(p.name,44)}<div class="grow"><b>Provider ${'ABC'[S.qs.indexOf(x)]}: ${esc(p.name)}</b><div class="sub">${p.rating.toFixed(1)} rating, ${p.exp} years, ${p.dist} km</div></div></div>
<div class="mt"><div class="kv"><span>Labour</span><span>${fmt(x.labour)}</span></div><div class="kv"><span>Materials</span><span>${fmt(x.mat)}</span></div><div class="kv"><span>Transport</span><span>${fmt(x.tr)}</span></div><div class="total"><span>Total</span><span>${fmt(tot(x))}</span></div></div>${x.st==='changes'?'<span class="badge amber mt2">Changes requested</span>':''}
<div class="row wrap mt"><button class="btn sm grow" data-a="qAccept" data-id="${x.pid}">Accept Quote</button><button class="btn sm plain" data-a="qChange" data-id="${x.pid}">Request Changes</button><button class="btn sm plain" data-a="qDecline" data-id="${x.pid}">Decline</button></div></div>`}).join('')}</div>`:empty('📄','No quotes left','You declined all quotes. Request new ones any time.',`<button class="btn" data-a="reqQuotes">Request quotes again</button>`)}`};
/* ---- chat ---- */
V.chat=()=>{const th=S.threads[S.params.tid];if(!th)return empty('💬','No conversation','',`<button class="btn" data-a="back">Back</button>`);const me=S.role==='provider'?'p':'c';const p=prov(th.pid);const other=S.role==='provider'?'Ahamed':p.name;
const quick=S.role==='provider'?[['Yes, I can do it 👍','text'],['Send location','loc'],['Send quotation','text','Quotation: LKR 2,500 plus materials, if approved.'],['Choose time and date','text','Which time works best for you?'],['Cannot do the job','text','Sorry, I cannot take this job.']]:[['Are you available today?','text'],['The gate is open','text'],['Send my location','loc'],['Please call me','text']];
return`<div class="chatwrap"><div class="row mb"><button class="iconbtn" data-a="back" aria-label="Back">${ic('back',22)}</button>${av(other,42)}<div class="grow"><b>${esc(other)}</b><div class="sub">${S.role==='provider'?'Customer':esc(cat(p.cat).name)} · booking ${esc(S.params.tid.startsWith('pre')?'not started':S.params.tid)}</div></div>${S.role==='customer'?`<button class="iconbtn" data-a="call" data-v="${esc(p.phone)}" aria-label="Call">${ic('phone',22)}</button>`:''}</div>
<div class="chatbody" id="chatbody">${th.msgs.map(m=>`<div class="bub ${m.f===me?'me':'them'}">${m.k==='img'?`<span class="row">${ic('image',18)} Photo shared</span>`:m.k==='loc'?`<span class="row">${ic('pin',18)} Location shared</span>`:esc(m.t)}<small>${esc(m.ts)}</small></div>`).join('')}</div>
<div class="quick">${quick.map((q,i)=>`<button class="chip" data-a="quick" data-i="${i}">${esc(q[0])}</button>`).join('')}</div>
<div class="chatin"><button class="iconbtn" data-a="chatImg" aria-label="Send photo">${ic('image',22)}</button><button class="iconbtn" data-a="chatLoc" aria-label="Share location">${ic('pin',22)}</button><input class="in" id="chatin" placeholder="Type a message..." aria-label="Message" data-b="chatDraft" data-enter="chatSend" value="${esc(S.chatDraft)}"><button class="btn" data-a="chatSend" aria-label="Send">${ic('send',18)}</button></div></div>`};
/* ---- pay / review ---- */
V.pay=()=>{const b=bk(S.params.id);if(!b||!b.final)return empty('💳','Nothing to pay yet','Payment opens once the FixMate marks the job completed.',`<button class="btn" data-a="back">Back</button>`);const f=b.final;const st=b.paid?'done':(S.ui.pay==='processing'?'processing':null);
if(st==='done')return`<div class="card center" style="margin-top:20px"><div class="okc">${ic('check',44)}</div><h2>Payment successful</h2><p class="sub mt2">${fmt(f.total)} paid for ${esc(b.svc)}. (Simulated payment, no money moved.)</p><div class="row mt wrap" style="justify-content:center"><button class="btn" ${G('review',{id:b.id})}>${ic('star',18)}Rate your FixMate</button><button class="btn plain" ${R('bookings',{})}>Skip for now</button></div></div>`;
const ms=[['cash','Cash','Pay the provider in cash on completion'],['card','Card','Demo checkout, do not enter real card details'],['bank','Bank transfer','Transfer to the FixMate escrow account (demo)'],['wallet','Digital wallet','Pay from your mobile wallet (demo)']];
return`${pageHead('Payment','Booking '+b.id)}<div class="grid g2"><div class="card"><h3>Payment summary</h3><div class="mt2"><div class="kv"><span>Service</span><span>${fmt(f.svc)}</span></div><div class="kv"><span>Travel</span><span>${fmt(f.travel)}</span></div>${f.prio?`<div class="kv"><span>Emergency fee</span><span>${fmt(f.prio)}</span></div>`:''}<div class="kv"><span>Materials</span><span>${fmt(f.mat)}</span></div><div class="total"><span>Total</span><span>${fmt(f.total)}</span></div></div></div>
<div class="card"><h3>Payment method</h3><div class="mt2">${ms.map(m=>`<button class="opt ${S.pay===m[0]?'on':''}" data-a="payPick" data-v="${m[0]}"><span class="radio"></span><span><b>${m[1]}</b><div class="sub" style="font-weight:500">${m[2]}</div></span></button>`).join('')}</div>
<button class="btn green block mt" data-a="doPay" ${st==='processing'?'disabled':''}>${st==='processing'?'Processing...':'Confirm Payment'}</button><div class="sub mt2 center">Simulated checkout. No real payment gateway is connected.</div></div></div>`};
V.review=()=>{const b=bk(S.params.id);const p=prov(b.pid);const r=S.rv;const cats=[['prof','Professionalism'],['qual','Quality'],['comm','Communication'],['punc','Punctuality'],['val','Value']];
return`${pageHead('How was your FixMate?',`${esc(p.name)} · ${esc(b.svc)}`)}<div class="card center">${av(p.name,64)}<h3 class="mt2">Rate your experience</h3><div style="display:flex;justify-content:center;margin-top:6px">${starsInput('overall',r.overall)}</div></div>
<div class="card mt">${cats.map(c=>`<div class="row between wrap" style="padding:6px 0"><span>${c[1]}</span>${starsInput(c[0],r[c[0]],true)}</div>`).join('')}<label class="f" for="rc">Comment</label><textarea id="rc" class="ta" data-b="rv.text" placeholder="Tell us about your experience...">${esc(r.text)}</textarea>${S.err?`<div class="err">${esc(S.err)}</div>`:''}</div>
<div class="mt"><button class="btn block" data-a="submitReview" data-id="${b.id}">Submit Review</button></div>`};
/* ---- become a fixmate ---- */
V.become=()=>{const b=S.become;if(S.ui.applied)return`<div class="card center" style="margin-top:20px"><div class="okc">${ic('check',44)}</div><h2>Application received</h2><span class="badge amber mt2">Verification pending</span><p class="sub mt2">Documents are checked before the Verified FixMate badge appears. In this prototype, review is simulated in the Admin view.</p><div class="row mt wrap" style="justify-content:center"><button class="btn" data-a="role" data-v="provider">See the provider dashboard</button><button class="btn plain" data-a="role" data-v="admin">See the admin review</button></div></div>`;
const chk=(k,l)=>`<button class="opt ${b[k]?'on':''}" data-a="docToggle" data-v="${k}"><span class="radio"></span>${ic('upload',18)}${l}<span class="sub" style="margin-left:auto">${b[k]?'Uploaded (simulated)':'Tap to upload'}</span></button>`;
return`${pageHead('Become a FixMate','Earn from your skills. Set your area, prices and hours.')}<div class="grid g2"><div class="card"><h3>About you</h3><label class="f" for="bn">Full name</label><input id="bn" class="in" data-b="become.name" value="${esc(b.name)}"><label class="f" for="bp">Phone</label><input id="bp" class="in" data-b="become.phone" placeholder="+94 77 123 4567" value="${esc(b.phone)}"><label class="f" for="bc">Main service</label><select id="bc" class="sel" data-c="bcat">${CATS.filter(c=>c.on).map(c=>`<option value="${c.id}" ${b.cat===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><label class="f" for="by">Years of experience</label><input id="by" class="in" type="number" min="0" data-b="become.years" value="${esc(b.years)}"><label class="f" for="ba">Service area (town)</label><select id="ba" class="sel" data-c="barea">${Object.values(LK).flatMap(d=>Object.values(d).flat()).map(c=>`<option ${b.area===c?'selected':''}>${c}</option>`).join('')}</select></div>
<div class="card"><h3>Verification documents</h3><p class="sub mt2">Upload clear photos. Files are checked for type and size in the real product.</p><div class="mt2">${chk('nic','National ID (NIC)')}${chk('cert','Certificate or qualification')}${chk('addr','Proof of address')}</div>${S.err?`<div class="err">${esc(S.err)}</div>`:''}<button class="btn block mt" data-a="applySubmit">Submit application</button></div></div>`};
/* ---- provider views ---- */
const rangeOf=r=>r.range&&r.range[1]?fmt(r.range[0])+' to '+fmt(r.range[1]).replace('LKR ',''):'Quote required';
function liveReq(b){const range=[b.base,b.base+1500];return`<article class="card"><div class="row between wrap"><span class="badge blue">New Service Request</span>${b.emergency?'<span class="badge red">Emergency</span>':''}</div><h3 class="mt2">${esc(cat(b.cat).name)}: ${esc(b.svc)}</h3>
<div class="chips mt2"><span class="mini">${ic('user',14)}Ahamed</span><span class="mini">${ic('pin',14)}${esc(b.addr.city)}, ${prov(b.pid).dist} km</span><span class="mini">${ic('calendar',14)}${esc(dateLbl(b.date))}, ${esc(b.time)}</span></div>
<p class="mt2">“${esc(b.desc)}”</p><div class="mt2">${thumbs(b.photos)}</div><div class="kv mt2"><span>Estimated</span><b>${fmt(range[0])} to ${fmt(range[1]).replace('LKR ','')}</b></div>
<div class="row wrap mt"><button class="btn grow" data-a="accept" data-id="${b.id}">Accept</button><button class="btn plain" data-a="decline" data-id="${b.id}">Decline</button><button class="btn ghost" ${G('chat',{tid:b.id})}>${ic('chat',16)}Message Customer</button></div></article>`}
function seedReq(r){return`<article class="card"><span class="badge blue">New Service Request</span><h3 class="mt2">${esc(cat(r.cat).name)}: ${esc(r.svc)}</h3><div class="chips mt2"><span class="mini">${ic('user',14)}${esc(r.cust)}</span><span class="mini">${ic('pin',14)}${esc(r.city)}, ${r.km} km</span><span class="mini">${ic('calendar',14)}${esc(r.when)}</span></div><p class="mt2">“${esc(r.desc)}”</p><div class="mt2">${thumbs(r.photos)}</div><div class="kv mt2"><span>Estimated</span><b>${rangeOf(r)}</b></div>
<div class="row wrap mt">${r.quote?`<button class="btn grow" data-a="quoteOpen" data-id="${r.id}">Send Quote</button>`:`<button class="btn grow" data-a="reqAccept" data-id="${r.id}">Accept</button>`}<button class="btn plain" data-a="reqDecline" data-id="${r.id}">Decline</button><button class="btn ghost" data-a="toast" data-v="Demo request: messaging is available on the live booking.">${ic('chat',16)}Message Customer</button></div></article>`}
const NEXT=['','Start travel (On The Way)','Mark arrived','Start work','Complete work'];
function jobCard(b){const tot=b.final?b.final.total:b.est;return`<article class="card"><div class="row between wrap"><span class="badge blue">${b.id}</span>${chipFor(b)}</div><h3 class="mt2">${esc(cat(b.cat).name)}: ${esc(b.svc)}</h3><div class="chips mt2"><span class="mini">${ic('user',14)}Ahamed</span><span class="mini">${ic('pin',14)}${esc(addrLine(b.addr))}</span><span class="mini">${ic('calendar',14)}${esc(dateLbl(b.date))}, ${esc(b.time)}</span></div>
<div class="mt2">${timeline({...b,cancelled:false})}</div><div class="kv mt2"><span>${b.final?'Final':'Estimated'}</span><b>${fmt(tot)}${b.final?'':'+'}</b></div>
<div class="row wrap mt">${b.st>=1&&b.st<5?`<button class="btn grow" data-a="${b.st===4?'completeAsk':'advance'}" data-id="${b.id}">${NEXT[b.st]}</button>`:''}${b.st===5?`<span class="badge ${b.paid?'green':'amber'}">${b.paid?'Paid '+fmt(tot):'Waiting for customer payment'}</span>`:''}<button class="btn ghost sm" ${G('chat',{tid:b.id})}>${ic('chat',16)}Message</button><button class="btn plain sm" data-a="navTo">${ic('map',16)}Navigate</button></div></article>`}
const myJobs=()=>S.bookings.filter(b=>b.pid===S.pid&&!b.seed&&!b.cancelled);
const monthTotal=()=>84500+myJobs().filter(b=>b.paid).reduce((s,b)=>s+b.final.total,0);
V.pdash=()=>{const p=prov(S.pid);const jobs=myJobs();const newLive=jobs.filter(b=>b.st===0);const seedR=S.pid==='p1'?S.reqs:[];const active=jobs.filter(b=>b.st>=1);
const todayN=(S.pid==='p1'?3:1)+active.filter(b=>!b.paid).length+S.pacc.length;
return`<div class="row between wrap mb"><div><h2>Good morning, ${esc(first(p.name))} 👋</h2><div class="sub">${esc(p.city)} · ${cat(p.cat).name}</div></div><div class="row"><span class="sub">Available now</span><button class="tg ${S.avail?'on':''}" data-a="availTog" role="switch" aria-checked="${S.avail}" aria-label="Available now"></button></div></div>
<div class="grid g4"><div class="stat"><span>Today's jobs</span><b>${todayN}</b></div><div class="stat"><span>Pending requests</span><b>${newLive.length+seedR.length}</b></div><div class="stat"><span>This month</span><b>${fmt(monthTotal())}</b></div><div class="stat"><span>Rating</span><b>${p.rating.toFixed(1)} ⭐</b></div></div>
<div class="sec"><h2 class="mb">New requests</h2>${newLive.length+seedR.length?`<div class="grid g2">${newLive.map(liveReq).join('')}${seedR.map(seedReq).join('')}</div>`:empty('📥','No new requests','New jobs near you will appear here.')}</div>
<div class="sec"><h2 class="mb">Today's jobs</h2><div class="grid g2">${active.map(jobCard).join('')}${S.pid==='p1'?[['10:00 AM','Tap installation','Kalmunai'],['12:30 PM','Bathroom leak check','Akkaraipattu']].map(x=>`<div class="card row"><span class="tile" style="background:var(--green-50);color:var(--green)">${ic('check',22)}</span><div class="grow"><b>${x[1]}</b><div class="sub">${x[0]} · ${x[2]}</div></div><span class="badge gray">Scheduled</span></div>`).join(''):''}${S.pacc.map(x=>`<div class="card row"><span class="tile" style="background:var(--blue-50);color:var(--blue)">${ic('calendar',22)}</span><div class="grow"><b>${esc(x.svc)}</b><div class="sub">${esc(x.cust)} · ${esc(x.when)}</div></div><span class="badge blue">Accepted</span></div>`).join('')}</div></div>`};
V.pjobs=()=>{const tabs=['New','Today','Upcoming','Completed'];const jobs=myJobs();const seedR=S.pid==='p1'?S.reqs:[];let body='';
if(S.ptab==='New'){const a=jobs.filter(b=>b.st===0);body=a.length+seedR.length?`<div class="grid g2">${a.map(liveReq).join('')}${seedR.map(seedReq).join('')}</div>`:empty('📥','No new requests','New jobs near you will appear here.')}
if(S.ptab==='Today'){const a=jobs.filter(b=>b.st>=1&&!(b.st===5&&b.paid));body=a.length?`<div class="grid g2">${a.map(jobCard).join('')}</div>`:empty('📅','No jobs in progress','Accept a request to see it here.')}
if(S.ptab==='Upcoming'){body=S.pacc.length?`<div class="grid g2">${S.pacc.map(x=>`<div class="card"><b>${esc(x.svc)}</b><div class="sub">${esc(x.cust)} · ${esc(x.when)}</div></div>`).join('')}</div>`:empty('🗓️','Nothing upcoming','Accepted jobs for later dates show here.')}
if(S.ptab==='Completed'){const a=jobs.filter(b=>b.st===5&&b.paid);body=a.length?`<div class="grid g2">${a.map(jobCard).join('')}</div>`:empty('✅','No completed jobs yet','Finished and paid jobs will appear here.')}

const app=document.getElementById('app'),modalRoot=document.getElementById('modal');
let toastT;
function toast(msg,bad){const el=document.getElementById('toast');el.textContent=msg;el.className='show'+(bad?' bad':'');clearTimeout(toastT);toastT=setTimeout(()=>{el.className=''},2800)}
function render(){const y=window.scrollY||0;let body;try{body=(V[S.route]||V.home)()}catch(e){console.error(e);body=empty('⚠️','Something went wrong','This screen could not load. Try going back.',`<button class="btn" data-a="back">Go back</button>`)}
const land=S.role==='landing';
app.innerHTML=demoBar()+(land?'':header())+offlineBar()+(land?`<div id="main">${body}</div>`:`<main class="view${S.fade?' fade':''}" id="main">${body}</main>`)+(land?'':bottomNav());
S.fade=false;modalRoot.innerHTML=modalHtml();window.scrollTo(0,y);
const cb=document.getElementById('chatbody');if(cb)cb.scrollTop=cb.scrollHeight}
function go(r,p,o){o=o||{};if(!o.replace)S.stack.push([S.route,S.params]);S.route=r;S.params=p||{};S.err='';S.fade=true;render();window.scrollTo(0,0)}
function root(r,p){S.stack=[];S.route=r;S.params=p||{};S.err='';S.fade=true;if(p&&p.tab)S.tab=p.tab;render();window.scrollTo(0,0)}
function back(){const x=S.stack.pop();if(x){S.route=x[0];S.params=x[1]}else S.route=S.role==='provider'?'pdash':S.role==='admin'?'admin':'home';S.err='';S.fade=true;render();window.scrollTo(0,0)}
function setRole(r){S.role=r;S.stack=[];S.modal=null;S.err='';S.route=r==='customer'?'home':r==='provider'?'pdash':r==='admin'?'admin':'landing';S.fade=true;render();window.scrollTo(0,0)}
function notify(role,text){S.notifs[role].unshift({t:text,ts:'Just now',u:1});if(S.role===role)toast(text)}
function loadProviders(){S.loading=true;setTimeout(()=>{S.loading=false;if(S.route==='providers')render()},700)}
function say(tid,f,text,k){const th=S.threads[tid];if(!th)return;th.msgs.push({f,t:text,k:k||'text',ts:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})})}
const CUST_REPLY=['Thank you!','Okay, I will be home.','The gate is open.','Great, see you then.'],PROV_REPLY=['Sure, no problem.','I will be there as planned.','Please send a photo if you can.','Okay 👍'];
let rr=0;
function autoReply(tid){const me=S.role==='provider'?'p':'c';const tr=tid;setTimeout(()=>{say(tr,me==='c'?'p':'c',(me==='c'?PROV_REPLY:CUST_REPLY)[rr++%4]);if(S.route==='chat'&&S.params.tid===tr)render()},1200)}
function createBooking(){const p=prov(S.params.pid),d=S.draft,q=calc(p,d);const id='FM-'+(24817+S.seq++);
const b={id,pid:p.id,cat:p.cat,svc:d.svc||cat(p.cat).svcs[0],desc:d.desc,photos:d.photos,addr:{...S.addr},date:d.date,time:d.time,base:q.base,travel:q.travel,prio:q.prio,est:q.total,st:0,paid:false,review:null,cancelled:false,emergency:d.emergency,final:null};
S.bookings.unshift(b);S.threads[id]={pid:p.id,msgs:[]};say(id,'c','Hi, are you available around '+d.time+'?');S.pid=p.id;S.ui.just=id;S.cmp=[];
notify('provider','New '+cat(p.cat).name.toLowerCase()+' request near '+S.addr.city+'.');return b}
function advance(id,mat){const b=bk(id);if(!b||b.st>=5)return;b.st++;const p=prov(b.pid),f=first(p.name);S.ui.just=null;
if(b.st===1){say(id,'p','Yes, I can reach you around '+b.time.replace(/:(\d\d)/,(m,mm)=>':'+String(Math.max(0,+mm-10)).padStart(2,'0'))+'.');notify('customer','Your FixMate '+f+' has accepted your booking.')}
if(b.st===2){say(id,'p','I am on the way. About 12 minutes.');notify('customer',f+' is on the way.')}
if(b.st===3)notify('customer',f+' has arrived.');
if(b.st===4)notify('customer','Work has started.');
if(b.st===5){const m=mat==null?800:+mat;b.final={svc:b.base,travel:b.travel,prio:b.prio,mat:m,total:b.base+b.travel+b.prio+m};notify('customer','Your service has been marked completed. Total '+fmt(b.final.total)+'.')}
render()}

/* ================= actions ================= */
const ACT={};
ACT.go=(d)=>go(d.r,JSON.parse(d.p||'{}'));
ACT.root=(d)=>root(d.r,JSON.parse(d.p||'{}'));
ACT.back=()=>back();
ACT.role=d=>setRole(d.v);
ACT.scroll=d=>{const el=document.getElementById(d.v);if(el)el.scrollIntoView({behavior:'smooth'})};
ACT.toast=d=>toast(d.v);
ACT.call=d=>toast('Calling '+d.v+' (simulated)');
ACT.navTo=()=>toast('Opening navigation to the customer address (simulated)');
ACT.modal=d=>{S.modal={t:d.v};if(d.v==='loc')S.ui.loc={p:S.loc.province,d:S.loc.district,c:S.loc.city};render()};
ACT.mclose=()=>{S.modal=null;render()};
ACT.ovx=(d,el,e)=>{if(e.target===el){S.modal=null;render()}};
ACT.auth=d=>{S.ui.auth={step:1,role:d.v||null};S.modal={t:'auth'};if(d.v){S.ui.auth.step=2;S.ui.auth.role=d.v}render()};
ACT.authRole=d=>{S.ui.auth={step:2,role:d.v};render()};
ACT.authNext=()=>{S.ui.auth.step++;render()};
ACT.authDone=()=>{const r=S.ui.auth.role||'customer';setRole(r);toast('Signed in as demo '+r)};
ACT.signout=()=>{S.role='landing';S.route='landing';S.stack=[];render();window.scrollTo(0,0)};
ACT.lang=d=>{S.lang=d.v;render()};
ACT.findService=()=>{S.role='customer';S.stack=[];S.route='services';S.fade=true;render();window.scrollTo(0,0)};
ACT.pickCat=d=>{if(S.role==='landing'){S.role='customer';S.route='home';S.stack=[]}S.draft=newDraft(d.id);S.filters={};go('category',{})};
ACT.pickSvc=d=>{S.draft.svc=d.v;go('request')};
ACT.pickSvcInline=d=>{S.draft.svc=d.v;render()};
ACT.skipToProviders=()=>{loadProviders();go('providers')};
ACT.addPhoto=()=>{if(S.draft.photos>=6)return toast('You can add up to 6 photos.');S.draft.photos++;render()};
ACT.addVideo=()=>{S.draft.video=!S.draft.video;render()};
ACT.samplePhotos=()=>{S.draft.photos=3;render()};
ACT.toLocation=()=>{if(S.draft.desc.trim().length<8){S.err='Please describe the problem in a few words (at least 8 characters).';return render()}if(!S.draft.svc)S.draft.svc=cat(S.draft.cat).svcs[0];go('location')};
ACT.src=d=>{S.src=d.v;if(d.v==='current')Object.assign(S.addr,{city:'Akkaraipattu',district:'Ampara',province:'Eastern Province',postal:'32400'});render()};
ACT.findProviders=()=>{if(!S.addr.house.trim()||!S.addr.city.trim()){S.err='Please enter your house or building and city.';return render()}S.loc.city=S.addr.city;loadProviders();go('providers')};
ACT.flt=d=>{const v=d.v==='true'?true:isNaN(+d.v)?d.v:+d.v;S.filters[d.k]=S.filters[d.k]===v?0:v;render()};
ACT.clearFlt=()=>{S.filters={};render()};
ACT.cmp=d=>{const i=S.cmp.indexOf(d.id);if(i>=0)S.cmp.splice(i,1);else if(S.cmp.length>=3)return toast('Compare up to 3 FixMates.');else S.cmp.push(d.id);render()};
ACT.fav=d=>{const i=S.fav.indexOf(d.id);if(i>=0){S.fav.splice(i,1);S.ui.pop=null}else{S.fav.push(d.id);S.ui.pop=d.id;toast('Saved to your FixMates')}render();S.ui.pop=null};
ACT.tab=d=>{S.tab=d.v;render()};ACT.ptab=d=>{S.ptab=d.v;render()};ACT.atab=d=>{S.atab=d.v;render()};
ACT.bookNow=d=>{const p=prov(d.id);if(p.model==='quote'){S.draft=newDraft(p.cat);S.draft.svc=cat(p.cat).svcs[0];return ACT.reqQuotes()}
if(S.draft.cat!==p.cat){S.draft=newDraft(p.cat);S.draft.svc=svcList(p)[0][0]}if(!S.draft.svc)S.draft.svc=svcList(p)[0][0];S.bstep=1;go('book',{pid:p.id})};
ACT.bnext=()=>{const d=S.draft;if(S.bstep===1&&d.desc.trim().length<8){S.err='Please describe the problem (at least 8 characters).';return render()}if(S.bstep===2&&(!S.addr.house.trim()||!S.addr.city.trim())){S.err='Please enter your address.';return render()}S.err='';S.bstep++;render();window.scrollTo(0,0)};
ACT.bprev=()=>{S.err='';S.bstep--;render()};
ACT.pickDate=d=>{S.draft.date=d.v;render()};ACT.pickTime=d=>{S.draft.time=d.v;render()};
ACT.confirmBook=()=>{if(S.offline){S.err='You appear to be offline. Reconnect and try again.';return go('error',{})}
if(S.simError){S.simError=false;S.err='The booking service did not respond. Your details are saved. Please try again.';return go('error',{})}
const b=createBooking();S.stack=[];root('booking',{id:b.id});toast('Booking request sent!')};
ACT.retry=()=>{back()};
ACT.advance=d=>advance(d.id);
ACT.accept=d=>advance(d.id);
ACT.decline=d=>{const b=bk(d.id);b.cancelled=true;b.declined=true;notify('customer','Your provider could not take this job. You have not been charged.');toast('Request declined');render()};
ACT.completeAsk=d=>{S.ui.mat=800;S.modal={t:'complete',id:d.id};render()};
ACT.completeYes=d=>{const m=S.ui.mat==null?800:Math.max(0,+S.ui.mat||0);S.modal=null;advance(d.id,m)};
ACT.cancelAsk=d=>{S.modal={t:'cancel',id:d.id};render()};
ACT.cancelYes=d=>{const b=bk(d.id);b.cancelled=true;S.modal=null;notify('provider','A customer cancelled a booking.');S.stack=[];root('cancelled',{id:d.id})};
ACT.chat=()=>{};
ACT.msgProv=d=>{const tid='pre-'+d.id;if(!S.threads[tid])S.threads[tid]={pid:d.id,msgs:[{f:'c',t:'Hi, are you available this week?',k:'text',ts:'now'}]};go('chat',{tid})};
ACT.chatSend=()=>{const v=S.chatDraft.trim();if(!v)return;const tid=S.params.tid;say(tid,S.role==='provider'?'p':'c',v);S.chatDraft='';render();autoReply(tid);const i=document.getElementById('chatin');if(i)i.focus()};
ACT.chatImg=()=>{say(S.params.tid,S.role==='provider'?'p':'c','','img');render();autoReply(S.params.tid)};
ACT.chatLoc=()=>{say(S.params.tid,S.role==='provider'?'p':'c','','loc');render();autoReply(S.params.tid)};
ACT.quick=d=>{const me=S.role==='provider'?'p':'c';const P=[['Yes, I can do it 👍','text'],['Send location','loc'],['Send quotation','text','Quotation: starting from LKR 2,500 plus materials, if approved.'],['Choose time and date','text','Which time works best for you?'],['Cannot do the job','text','Sorry, I cannot take this job.']];
const C=[['Are you available today?','text'],['The gate is open','text'],['Send my location','loc'],['Please call me','text']];const q=(me==='p'?P:C)[+d.i];say(S.params.tid,me,q[2]||q[0],q[1]);render();autoReply(S.params.tid)};
ACT.payPick=d=>{S.pay=d.v;render()};
ACT.doPay=()=>{if(S.offline)return toast('You appear to be offline.',true);const b=bk(S.params.id);S.ui.pay='processing';render();setTimeout(()=>{b.paid=true;S.ui.pay='done';notify('provider','Customer payment of '+fmt(b.final.total)+' received.');if(S.route==='pay')render()},1300)};
ACT.rate=d=>{S.rv[d.k]=+d.v;if(d.k==='overall'){['prof','qual','comm','punc','val'].forEach(k=>{if(!S.rv[k])S.rv[k]=+d.v})}render()};
ACT.submitReview=d=>{if(!S.rv.overall){S.err='Please choose a star rating first.';return render()}const b=bk(d.id),p=prov(b.pid);b.review={overall:S.rv.overall};
p.rating=Math.round(((p.rating*p.rv+S.rv.overall)/(p.rv+1))*10)/10;p.rv++;p.revs.unshift({n:'Ahamed',r:S.rv.overall,t:S.rv.text||'Rated without a comment.',d:'Just now'});
notify('provider','New review received.');S.rv={overall:0,prof:0,qual:0,comm:0,punc:0,val:0,text:''};S.ui.pay=null;S.ui.just=null;S.tab='Completed';S.stack=[];root('bookings');toast('Review submitted. Thank you!')};
ACT.reqQuotes=()=>{S.qs=['p9','p10','p11'].map(id=>({pid:id,...QDATA[id],st:'new'}));S.qLoading=true;go('quotes');setTimeout(()=>{S.qLoading=false;if(S.route==='quotes')render()},1100)};
ACT.qAccept=d=>{const x=S.qs.find(q=>q.pid===d.id),p=prov(d.id);const total=x.labour+x.mat+x.tr;const id='FM-'+(24817+S.seq++);
S.bookings.unshift({id,pid:p.id,cat:'painting',svc:'Full house painting (quoted)',desc:'Whole-house painting as per accepted quote.',photos:2,addr:{...S.addr},date:'Saturday',time:'10:00 AM',base:total,travel:0,prio:0,est:total,st:1,paid:false,review:null,cancelled:false,final:null});
S.threads[id]={pid:p.id,msgs:[]};say(id,'p','Thanks for accepting my quote. I will confirm the start date shortly.');S.pid=p.id;notify('customer','You accepted '+first(p.name)+"'s quote of "+fmt(total)+'.');S.stack=[];root('booking',{id})};
ACT.qDecline=d=>{S.qs.find(q=>q.pid===d.id).st='declined';toast('Quote declined');render()};
ACT.qChange=d=>{S.qs.find(q=>q.pid===d.id).st='changes';toast('Change request sent to '+first(prov(d.id).name));render()};
ACT.setQ=d=>{S.q=d.v;render()};
ACT.doSearch=()=>{go('search')};
ACT.emerg=d=>{S.draft=newDraft(d.id);S.draft.emergency=true;S.draft.svc=cat(d.id).svcs[0];S.draft.desc=d.v+': ';S.filters={};S.sort='fast';go('request')};
ACT.repPick=d=>{S.rep.reason=d.v;render()};
ACT.repSend=()=>{if(!S.rep.reason){S.err='Please choose what went wrong.';return render()}S.reports.unshift({...S.rep});notify('admin','New report: '+S.rep.reason);S.rep={reason:'',text:''};S.err='';toast('Report sent. Our team will review it.');render()};
ACT.disputeAsk=d=>{S.modal={t:'dispute',id:d.id};render()};
ACT.disputeSend=d=>{S.disputes.unshift({id:'DP-'+(1042+S.seq++),bid:d.id,by:'Ahamed',reason:d.v,st:0});S.modal=null;notify('admin','New dispute raised for '+d.id);toast('Dispute submitted');render()};
ACT.advDispute=d=>{const x=S.disputes.find(z=>z.id===d.id);if(x.st<2)x.st++;render()};
ACT.resDispute=d=>{S.disputes.find(z=>z.id===d.id).st=2;toast('Dispute resolved');render()};
ACT.readAll=()=>{S.notifs[S.role].forEach(n=>n.u=0);render()};
ACT.docToggle=d=>{S.become[d.v]=S.become[d.v]?0:1;render()};
ACT.applySubmit=()=>{const b=S.become;if(!b.name.trim()||!b.phone.trim()||!(b.nic&&b.cert&&b.addr)){S.err='Add your name, phone number and all three documents to continue.';return render()}S.ui.applied=true;S.err='';S.verifs.unshift({id:'v'+(S.verifs.length+1),name:b.name,cat:cat(b.cat).name,exp:+b.years||0,docs:{NIC:1,Certificate:1,'Proof of address':1},st:'pending'});notify('admin','New provider application: '+b.name);render()};
ACT.availTog=()=>{S.avail=!S.avail;toast(S.avail?'You are available for new jobs':'You are offline');render()};
ACT.dayTog=d=>{S.week[+d.id][2]=S.week[+d.id][2]?0:1;render()};
ACT.pver=d=>{S.pver=d.v;render()};
ACT.reqAccept=d=>{const r=S.reqs.find(x=>x.id===d.id);S.reqs=S.reqs.filter(x=>x.id!==d.id);S.pacc.push({svc:r.svc,cust:r.cust,when:r.when});toast('Request accepted');render()};
ACT.reqDecline=d=>{S.reqs=S.reqs.filter(x=>x.id!==d.id);toast('Request declined');render()};
ACT.quoteOpen=d=>{S.qf={labour:45000,mat:30000,tr:5000};S.modal={t:'quote',id:d.id};render()};
ACT.quoteSend=d=>{const r=S.reqs.find(x=>x.id===d.id);S.reqs=S.reqs.filter(x=>x.id!==d.id);S.modal=null;S.pacc.push({svc:r.svc+' (quote sent)',cust:r.cust,when:r.when});toast('Quotation sent to '+r.cust);render()};
ACT.verif=d=>{const v=S.verifs.find(x=>x.id===d.id);v.st=d.v;toast({approved:'Approved (demo data)',rejected:'Rejected',info:'More information requested'}[d.v]);render()};
ACT.admView=d=>{S.modal={t:'bview',id:d.id};render()};
ACT.admCancel=d=>{const b=bk(d.id);if(b){b.cancelled=true;toast('Booking cancelled')}else toast('Booking cancelled (demo row)');render()};
ACT.admResolve=d=>{const x=S.disputes.find(z=>z.bid===d.id&&z.st<2);if(x){x.st=2;toast('Dispute resolved')}else toast('No open dispute for this booking');render()};
ACT.addCat=()=>{const v=(document.getElementById('nc').value||'').trim();if(!v)return toast('Enter a category name',true);const id=v.toLowerCase().replace(/[^a-z0-9]+/g,'-');if(CAT[id])return toast('That category exists',true);const c={id,name:v,emoji:'🛠️',g:4,svcs:DEF_SVC.split('|'),on:true};CATS.push(c);CAT[id]=c;toast('Category added');render()};
ACT.catTog=d=>{CAT[d.id].on=!CAT[d.id].on;render()};
ACT.offTog=()=>{S.offline=!S.offline;render()};ACT.errTog=()=>{S.simError=!S.simError;render()};
ACT.reset=()=>{const keep=S.role,cs=CATS.filter(c=>!CAT_RAW.find(r=>r[0]===c.id));cs.forEach(c=>{CATS.splice(CATS.indexOf(c),1);delete CAT[c.id]});CATS.forEach(c=>c.on=true);S=initState();S.role=keep==='landing'?'landing':keep;S.route=keep==='customer'?'home':keep==='provider'?'pdash':keep==='admin'?'admin':'landing';render();toast('Demo data reset')};
function startDemo(catId,svc,desc,photos){S.role='customer';S.modal=null;S.stack=[];S.draft={...newDraft(catId),svc,desc,photos};S.filters={};S.sort='rec';S.bstep=1;loadProviders();S.route='providers';S.params={};S.stack=[['home',{}]];S.fade=true;render();window.scrollTo(0,0)}
ACT.demo1=()=>{startDemo('plumbing','Pipe repair','The pipe under my kitchen sink is leaking heavily.',3);toast('Broken pipe scenario loaded. Open Mohamed Rizwan to continue.')};
ACT.demo2=()=>{startDemo('ac','Not cooling','My AC is not cooling.',1);toast('AC repair scenario loaded. Compare providers to continue.')};
/* change handlers */
const ACC={};
ACC.lang=v=>{S.lang=v;render()};ACC.sort=v=>{S.sort=v;render()};
ACC.bsvc=v=>{S.draft.svc=v;render()};ACC.bcat=v=>{S.become.cat=v};ACC.barea=v=>{S.become.area=v};
ACC.locP=v=>{const d=Object.keys(LK[v])[0];S.ui.loc={p:v,d,c:LK[v][d][0]};render()};
ACC.locD=v=>{const u=S.ui.loc;u.d=v;u.c=LK[u.p][v][0];render()};ACC.locC=v=>{S.ui.loc.c=v};
ACT.useCurrent=()=>{S.loc={city:'Akkaraipattu',district:'Ampara',province:'Eastern Province'};Object.assign(S.addr,{city:'Akkaraipattu',district:'Ampara',province:'Eastern Province',postal:'32400'});S.modal=null;render();toast('Using current location: Akkaraipattu (simulated)')};
ACT.locSaved=()=>{ACT.useCurrent()};
ACT.locApply=()=>{const u=S.ui.loc;S.loc={city:u.c,district:u.d,province:u.p};Object.assign(S.addr,{city:u.c,district:u.d,province:u.p,postal:''});S.modal=null;render();toast('Location set to '+u.c)};

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const f=ACT[el.dataset.a];if(!f)return;if(el.tagName==='A')e.preventDefault();f(el.dataset,el,e)});
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset||!el.dataset.b)return;const path=el.dataset.b;setPath(path,el.type==='number'?el.value:el.value);
if(path==='q'&&S.route==='search'){const r=document.getElementById('sres');if(r)r.innerHTML=searchRes()}
if(path.startsWith('qf.')){const t=document.getElementById('qtot');if(t)t.textContent=fmt(+S.qf.labour+ +S.qf.mat+ +S.qf.tr)}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.c&&ACC[el.dataset.c])ACC[el.dataset.c](el.value,el)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;render()}
if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter){e.preventDefault();ACT[e.target.dataset.enter]({},e.target,e)}});
window.addEventListener('offline',()=>{S.offline=true;render()});window.addEventListener('online',()=>{S.offline=false;render()});
render();
</script>
